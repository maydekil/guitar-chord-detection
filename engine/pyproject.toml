[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chord-engine"
version = "0.0.0"
description = "Python chord detection engine skeleton"
requires-python = ">=3.11,<3.12"
dependencies = [
	"numpy>=1.26",
	"scipy>=1.11",
	"librosa>=0.10",
	"soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["chord_engine*"]
